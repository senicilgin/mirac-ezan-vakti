name: Mirac Ezan Vakti APK

on:
  workflow_dispatch:

jobs:
  build_android:
    name: Android APK Olustur
    runs-on: ubuntu-24.04

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Linux bagimliliklarini kur
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            build-essential \
            autoconf \
            autoconf-archive \
            automake \
            autopoint \
            gettext \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            cmake \
            patch \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses-dev \
            libtinfo6

      - name: Buildozer ve Cython kur
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==3.0.11"
          python -m pip install --upgrade buildozer

          echo "Kurulu surumler:"
          python --version
          cython --version
          buildozer --version

      - name: Proje dosyalarini kontrol et
        shell: bash
        run: |
          echo "Calisma klasoru:"
          pwd

          echo "Ana dosyalar:"
          ls -la

          if [ ! -f "main.py" ]; then
            echo "HATA: main.py depo kokunde bulunamadi."
            exit 1
          fi

          if [ ! -f "buildozer.spec" ]; then
            echo "HATA: buildozer.spec depo kokunde bulunamadi."
            exit 1
          fi

          echo "Python kodu kontrol ediliyor:"
          python -m py_compile main.py

          echo "Assets dosyalari:"
          find assets -maxdepth 2 -type f -print 2>/dev/null || true

          echo "Android Java dosyalari:"
          find android_src -type f -print 2>/dev/null || true

          echo "Android XML kaynaklari:"
          find android_res -type f -print 2>/dev/null || true

      - name: Gerekli gorselleri kontrol et
        shell: bash
        run: |
          test -f assets/mirac_vakti_icon.png || {
            echo "HATA: assets/mirac_vakti_icon.png bulunamadi."
            exit 1
          }

          test -f assets/mirac_vakti_presplash.png || {
            echo "HATA: assets/mirac_vakti_presplash.png bulunamadi."
            exit 1
          }

          echo "Ikon ve acilis gorseli bulundu."

      - name: Buildozer ayarlarini kontrol et
        shell: bash
        run: |
          echo "Buildozer ayarlari:"
          grep -E \
            "^(title|package.name|package.domain|version|requirements|android.api|android.minapi|android.ndk|android.archs)" \
            buildozer.spec || true

          if grep -q "android.minapi = 23" buildozer.spec; then
            echo "HATA: android.minapi degeri 24 olmalidir."
            exit 1
          fi

          if grep -q "androidx.core:core" buildozer.spec &&
             grep "^requirements" buildozer.spec |
             grep -q "androidx.core"; then
            echo "HATA: AndroidX, requirements satirinda olmamalidir."
            exit 1
          fi

      - name: Eski derleme kalintilarini temizle
        shell: bash
        run: |
          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      - name: APK olustur
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          buildozer -v android debug \
            2>&1 |
            tee buildozer_full.log

      - name: Derleme kaydini temizle
        if: always()
        shell: bash
        run: |
          if [ -f buildozer_full.log ]; then
            sed -r \
              's/\x1B\[[0-9;]*[mK]//g' \
              buildozer_full.log \
              > buildozer_temiz.log
          else
            echo "Buildozer log dosyasi olusmadi." \
              > buildozer_temiz.log
          fi

      - name: Gercek hatayi goster
        if: always()
        shell: bash
        run: |
          echo "========== HATA SATIRLARI =========="

          grep -i -n \
            -B 15 \
            -A 35 \
            -E "fatal error:|error:|make: \*\*\*|traceback|build failed|command failed|exception|not found|no such file|cannot|could not|dependency.*not resolved|undefined macro" \
            buildozer_temiz.log |
            tail -n 600 || true

          echo "========== LOGUN SON 400 SATIRI =========="

          tail -n 400 buildozer_temiz.log || true

      - name: Derleme kayitlarini yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Buildozer-Derleme-Kaydi
          path: |
            buildozer_full.log
            buildozer_temiz.log
          if-no-files-found: warn
          retention-days: 7

      - name: Olusan paketleri bul
        if: always()
        shell: bash
        run: |
          echo "APK ve AAB dosyalari:"
          find . -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print || true

      - name: APK dosyasini yukle
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Mirac-Ezan-Vakti-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Derleme basarisizsa islemi durdur
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "APK derlemesi basarisiz oldu."
          echo "Gercek hatayi goster adimini inceleyin."
          echo "Ayrica Buildozer-Derleme-Kaydi dosyasini indirebilirsiniz."
          exit 1
