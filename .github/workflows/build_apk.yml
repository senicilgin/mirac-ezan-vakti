name: Mirac Ezan Vakti APK

on:
  workflow_dispatch:

jobs:
  build_android:
    name: Android APK Olustur
    runs-on: ubuntu-24.04

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Linux paketlerini kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            libffi-dev \
            libssl-dev \
            build-essential \
            cmake

      - name: Buildozer kur
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython

      - name: Projeyi kontrol et
        run: |
          pwd
          ls -la
          test -f main.py
          test -f buildozer.spec
          python -m py_compile main.py

      - name: APK olustur
        run: |
          yes | buildozer -v android debug

      - name: Olusan dosyalari goster
        if: always()
        run: |
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -print || true

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: Mirac-Ezan-Vakti-APK
          path: bin/*.apk
          if-no-files-found: *rror
          retention-days: 14
*
